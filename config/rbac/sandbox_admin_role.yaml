# This rule is not used by the project sandbox-factory itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sandbox.sandbox-factory.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sandbox-factory
    app.kubernetes.io/managed-by: kustomize
  name: sandbox-admin-role
rules:
- apiGroups:
  - sandbox.sandbox-factory.io
  resources:
  - sandboxes
  verbs:
  - '*'
- apiGroups:
  - sandbox.sandbox-factory.io
  resources:
  - sandboxes/status
  verbs:
  - get
